name: build-feather
on:
  push:
    branches: [vuk-sensor]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-feather.yml'
  workflow_dispatch:
defaults:
  run:
    shell: bash --noprofile --norc -x -e -o pipefail {0}
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      # The toolchain debs are 443 MB; the runners' Azure mirror served them at ~160 KB/s on
      # 2026-10-01 (40+ min). Same jammy packages from the main archive, kept in the cache.
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: arm-none-eabi-debs-jammy-v1
      - name: Install compiler, libraries and tools
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 update
          mkdir -p ~/apt-debs/partial
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-debs" -o Acquire::Retries=3 install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib srecord
          sudo chown -R "$USER" ~/apt-debs
      - name: Build (Feather RP2040 USB Host only)
        run: |
          mkdir build-feather
          cd build-feather
          PICO_BOARD=feather_host cmake ..
          make -j"$(nproc)" remapper
          # copy_to_ram image: whatever RAM the image and bss don't use is the heap
          arm-none-eabi-size remapper.elf
          arm-none-eabi-nm remapper.elf | grep -E ' (__end__|end|__HeapLimit|__StackLimit|__StackOneBottom|__StackBottom|__StackTop)$' || true
          mkdir ../artifacts
          mv remapper.uf2 ../artifacts/remapper_feather.uf2
        working-directory: ./firmware
      - uses: actions/upload-artifact@v7
        with:
          name: feather
          path: firmware/artifacts/*
